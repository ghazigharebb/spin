:root{
  --bg:#090B10; --panel:#11151D; --panel2:#171C27; --field:#0C0F15;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --text:#F5F2EA; --muted:#A0A7B4; --dim:#6C7482;
  --gold1:#FBE7A8; --gold2:#E8B84E; --gold3:#B9822A; --gold4:#6E4A12;
  --ruby:#E5484D;
  --wheel:min(90vw, 54vh);
  --rimw:calc(var(--wheel) * .036);
  --font:"Vazirmatn", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
}
@supports (height:1svh){ :root{ --wheel:min(90vw, 54svh); } }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%}
body{
  font-family:var(--font); color:var(--text); background:var(--bg);
  background-image:
    radial-gradient(1100px 760px at 50% 24%, rgba(232,184,78,.11), transparent 62%),
    radial-gradient(900px 620px at 50% 112%, rgba(37,99,235,.09), transparent 60%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden; min-height:100%;
}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none; padding:0}
[hidden]{display:none !important}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ───────── layout ───────── */
.app{max-width:1500px; margin:0 auto; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.stage{display:flex; flex-direction:column; align-items:center; padding:0 16px 22px; min-width:0}
.topbar{width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px 2px 6px}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; letter-spacing:0}
.brand svg{width:26px; height:26px; flex:none}
.tools{display:flex; gap:8px}
.tool{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; color:var(--muted);
  background:rgba(255,255,255,.04); border:1px solid var(--line); transition:color .15s, background .15s, border-color .15s}
.tool:hover{color:var(--text); border-color:var(--line2)}
.tool svg{width:20px; height:20px}
.tool[aria-pressed="false"]{color:var(--dim)}
.tool .off{display:none}
#fsBtn .off{display:block !important}
.tool[aria-pressed="false"] .on{display:none}
body.fs .tools{opacity:0; transition:opacity .3s}
body.fs .topbar:hover .tools{opacity:1}
body.fs .brand{opacity:0}
body.focus .panel{display:none}
body.focus .app{display:block}
body.focus .stage{min-height:100vh; justify-content:center}
.tool[aria-pressed="false"] .off{display:block}
#focusBtn{display:none}

/* prize */
.prize{width:min(100%, 640px); text-align:center; margin-top:4px}
.prize-label{display:flex; align-items:center; justify-content:center; gap:12px; color:var(--gold2); font-weight:700; font-size:13px}
.prize-label::before,.prize-label::after{content:""; height:1px; width:44px; background:linear-gradient(90deg, transparent, rgba(232,184,78,.6))}
.prize-label::before{transform:scaleX(-1)}
#prize{display:block; width:100%; resize:none; overflow:hidden; background:transparent; border:0; outline:0; text-align:center;
  font-weight:800; font-size:clamp(24px, 6.2vw, 40px); line-height:1.45; color:#FFF4D2; padding:2px 6px 0; border-radius:12px;
  caret-color:var(--gold2); min-height:1.45em; max-height:2.9em}
#prize::placeholder{color:rgba(255,255,255,.26); font-weight:600}
#prize:focus{background:rgba(255,255,255,.035)}

/* now chip */
.now{height:36px; margin-top:6px; display:flex; align-items:center; gap:8px; padding:0 14px 0 12px; border-radius:999px;
  background:rgba(12,15,21,.78); border:1px solid var(--line2); font-weight:700; font-size:15px; max-width:min(86vw, 420px)}
.ready .now{transition:border-color .2s, box-shadow .3s, opacity .2s}
.now.empty{opacity:0}
.now .pb{width:20px; height:20px; flex:none}
.now span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; unicode-bidi:plaintext}
.now.win{border-color:var(--gold2); box-shadow:0 0 0 3px rgba(232,184,78,.18), 0 0 28px rgba(232,184,78,.35)}

/* wheel */
.wheel-wrap{position:relative; width:var(--wheel); height:var(--wheel); margin-top:calc(var(--wheel) * .062); flex:none;
  cursor:pointer; outline:0; user-select:none; -webkit-user-select:none; touch-action:manipulation}
.rim{position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 205deg, #6E4A12, #F9E3A0 11%, #C08A2E 23%, #7A5417 37%, #F3D58A 51%, #B9822A 65%, #6E4A12 77%, #FBE7A8 90%, #6E4A12);
  box-shadow:0 0 0 1px rgba(0,0,0,.65), 0 calc(var(--wheel) * .05) calc(var(--wheel) * .13) rgba(0,0,0,.7), 0 0 calc(var(--wheel) * .3) rgba(232,184,78,.12)}
.rim::before{content:""; position:absolute; inset:calc(var(--rimw) * .12); border-radius:50%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35), inset 0 0 0 calc(var(--rimw) * .1) rgba(0,0,0,.12)}
.rim::after{content:""; position:absolute; inset:calc(var(--rimw) - 2px); border-radius:50%; background:#0A0C11; box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.bulb{position:absolute; left:50%; top:50%; width:calc(var(--rimw) * .4); height:calc(var(--rimw) * .4); margin:calc(var(--rimw) * -.2);
  border-radius:50%; background:radial-gradient(circle at 40% 35%, #fff, #FFEDB5 55%, #E0AE4C);
  transform:rotate(calc(var(--i) * 15deg)) translateY(calc(var(--wheel) * -.5 + var(--rimw) * .5));
  box-shadow:0 0 calc(var(--rimw) * .35) rgba(255,224,140,.9), 0 0 0 1px rgba(110,74,18,.6);
  animation:bulb 2.4s ease-in-out infinite; animation-delay:calc(var(--i) * -.2s)}
.spinning .bulb{animation-duration:.48s; animation-delay:calc(var(--i) * -.04s)}
@keyframes bulb{0%,100%{opacity:1; filter:brightness(1.1)} 50%{opacity:.45; filter:brightness(.7)}}
#wheel{position:absolute; left:var(--rimw); top:var(--rimw); width:calc(100% - var(--rimw) * 2); height:calc(100% - var(--rimw) * 2);
  border-radius:50%; will-change:transform; transform:rotate(0rad)}
.gloss{position:absolute; inset:var(--rimw); border-radius:50%; pointer-events:none;
  background:radial-gradient(115% 115% at 28% 14%, rgba(255,255,255,.17), transparent 44%),
             radial-gradient(100% 100% at 50% 50%, transparent 60%, rgba(0,0,0,.3) 100%);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.45), inset 0 0 calc(var(--wheel) * .05) rgba(0,0,0,.45)}
.hub{position:absolute; left:50%; top:50%; width:18.5%; height:18.5%; transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
  background:radial-gradient(circle at 34% 28%, #FFF6D0, #EAC062 34%, #A87420 70%, #5E3F0F);
  box-shadow:0 calc(var(--wheel) * .012) calc(var(--wheel) * .04) rgba(0,0,0,.6), inset 0 -3px 8px rgba(0,0,0,.35), 0 0 0 calc(var(--wheel) * .011) rgba(8,10,14,.55)}
.hub::before{content:""; position:absolute; inset:9%; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(255,255,255,.45), inset 0 0 0 2px rgba(110,74,18,.35)}
.hub::after{content:""; position:absolute; inset:27%; border-radius:50%;
  background:radial-gradient(circle at 36% 30%, #FF8E86, #D93A46 42%, #7E1620 85%);
  box-shadow:inset 0 2px 5px rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.45), 0 0 0 2px rgba(94,63,15,.9), 0 1px 0 3px rgba(255,255,255,.25)}
.pointer{position:absolute; left:50%; top:calc(var(--wheel) * -.058); width:calc(var(--wheel) * .092); height:calc(var(--wheel) * .1288);
  margin-left:calc(var(--wheel) * -.046); transform-origin:50% 31%; pointer-events:none; filter:drop-shadow(0 5px 7px rgba(0,0,0,.55)); will-change:transform; z-index:3}
.pointer svg{display:block; width:100%; height:100%}
.empty-msg{position:absolute; inset:0; display:grid; place-items:center; text-align:center; pointer-events:none; padding:26%; font-weight:700;
  font-size:clamp(13px, 3.6vw, 18px); color:var(--muted); line-height:1.8}
.empty-msg span{background:rgba(9,11,16,.82); border:1px solid var(--line2); padding:8px 16px; border-radius:14px; transform:translateY(calc(var(--wheel) * .2))}

/* spin button */
.spin-btn{margin-top:22px; width:min(330px, 84%); height:60px; border-radius:999px; font-weight:800; font-size:21px; color:#2A1A00;
  background:linear-gradient(180deg, #FFF0BF, #F0C562 42%, #D49B36);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), inset 0 -3px 0 rgba(122,84,23,.45), 0 10px 28px rgba(232,184,78,.28), 0 2px 0 #7A5417}
.ready .spin-btn{transition:transform .12s, filter .2s, opacity .2s}
.spin-btn:hover{filter:brightness(1.05)}
.spin-btn:active{transform:translateY(2px)}
.spin-btn:disabled{filter:grayscale(.75) brightness(.72); opacity:.75; cursor:not-allowed; box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 #4a4a4a}
.spinning .spin-btn{pointer-events:none; filter:saturate(.6) brightness(.8)}
.hint{margin-top:10px; height:20px; font-size:13px; color:var(--dim); font-weight:500}

/* ───────── panel ───────── */
.panel{margin:4px 12px 28px; background:var(--panel); border:1px solid var(--line); border-radius:22px; overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.4); display:flex; flex-direction:column; transition:opacity .25s}
.spinning .panel{pointer-events:none; opacity:.55}
.tabs{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px; border-bottom:1px solid var(--line)}
.tab{height:44px; border-radius:14px; font-weight:700; font-size:15px; color:var(--muted); display:flex; align-items:center; justify-content:center; gap:8px; transition:background .15s, color .15s}
.tab b{font-weight:700; font-size:12.5px; min-width:24px; padding:1px 7px; border-radius:999px; background:rgba(255,255,255,.07); color:var(--muted)}
.tab[aria-selected="true"]{background:var(--panel2); color:var(--text); box-shadow:inset 0 0 0 1px var(--line)}
.tab[aria-selected="true"] b{background:rgba(232,184,78,.16); color:var(--gold1)}
.pane{display:flex; flex-direction:column; min-height:0; flex:1}
.add{padding:14px 14px 4px; display:grid; gap:12px}
.add-row{display:flex; align-items:center; gap:10px}
.photo-pick{flex:none; width:54px; height:54px; border-radius:50%; display:grid; place-items:center; color:var(--muted); position:relative;
  background:var(--field); border:1.5px dashed rgba(255,255,255,.24); overflow:hidden; transition:border-color .15s, color .15s}
.photo-pick:hover{border-color:var(--gold2); color:var(--gold1)}
.photo-pick svg{width:22px; height:22px}
.photo-pick img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.photo-pick.has{border-style:solid; border-color:var(--gold2)}
.field{flex:1; min-width:0; height:54px; border-radius:16px; background:var(--field); border:1px solid var(--line2); padding:0 16px; font-size:16px; font-weight:600; outline:0; transition:border-color .15s, box-shadow .15s}
.field::placeholder{color:var(--dim); font-weight:500}
.field:focus{border-color:var(--gold2); box-shadow:0 0 0 3px rgba(232,184,78,.14)}
.plats{display:flex; gap:8px; flex:none}
.plat-opt{width:44px; height:44px; border-radius:50%; position:relative; opacity:.42; filter:saturate(.55); transition:opacity .15s, filter .15s, transform .15s}
.plat-opt .pb{width:100%; height:100%; display:block}
.plat-opt:hover{opacity:.8}
.plat-opt[aria-checked="true"]{opacity:1; filter:none; transform:scale(1.04)}
.plat-opt[aria-checked="true"]::after{content:""; position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--gold2)}
.btn-add{flex:1; height:46px; border-radius:14px; font-weight:800; font-size:16px; color:#2A1A00; background:linear-gradient(180deg, #FBE7A8, #E8B84E); box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 2px 0 #7A5417; transition:filter .15s, transform .1s}
.btn-add:hover{filter:brightness(1.06)} .btn-add:active{transform:translateY(1px)}
.quick{display:flex; gap:8px; padding:8px 14px 0; flex-wrap:wrap}
.ghost{height:36px; padding:0 12px; white-space:nowrap; flex:none; border-radius:11px; font-size:13.5px; font-weight:600; color:var(--muted); background:rgba(255,255,255,.04); border:1px solid var(--line); display:inline-flex; align-items:center; gap:7px; transition:color .15s, border-color .15s}
.ghost:hover{color:var(--text); border-color:var(--line2)}
.ghost svg{width:16px; height:16px}
.ghost.danger.sure{color:#fff; background:rgba(229,72,77,.22); border-color:rgba(229,72,77,.6)}
.bulk{padding:10px 14px 0; display:grid; gap:8px}
.bulk textarea{width:100%; min-height:112px; resize:vertical; border-radius:14px; background:var(--field); border:1px solid var(--line2); padding:12px 14px; font-size:16px; font-weight:500; line-height:1.8; outline:0}
.bulk textarea:focus{border-color:var(--gold2)}
.bulk textarea::placeholder{color:var(--dim)}
.list-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px 6px; color:var(--dim); font-size:13px; font-weight:600}
.list-head .acts{display:flex; gap:6px}
.list{list-style:none; margin:0; padding:2px 8px 12px; overflow:auto; -webkit-overflow-scrolling:touch; min-height:0; flex:1}
.row{display:grid; grid-template-columns:44px minmax(0,1fr) 36px 36px; align-items:center; gap:8px; padding:6px 6px; border-radius:14px}
.row:hover{background:rgba(255,255,255,.03)}
.av{width:44px; height:44px; border-radius:50%; overflow:hidden; background:var(--panel2); display:grid; place-items:center; color:var(--dim); border:1px solid var(--line2); position:relative}
.av img{width:100%; height:100%; object-fit:cover; display:block}
.av svg{width:18px; height:18px}
.av .ini{font-weight:800; font-size:17px; color:var(--gold1)}
.nm{min-width:0; width:100%; height:40px; background:transparent; border:1px solid transparent; border-radius:10px; padding:0 8px; font-size:16px; font-weight:600; outline:0; text-overflow:ellipsis}
.nm:hover{border-color:var(--line)} .nm:focus{border-color:var(--gold2); background:var(--field)}
.nm::placeholder{color:var(--dim); font-weight:500}
.rb{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:var(--dim); transition:color .15s, background .15s}
.rb:hover{color:var(--text); background:rgba(255,255,255,.06)}
.rb .pb{width:26px; height:26px}
.rb svg.ic{width:18px; height:18px}
.rb.none{border:1.5px dashed rgba(255,255,255,.2); width:28px; height:28px; margin:4px}
.rb.del:hover{color:#FF8E86; background:rgba(229,72,77,.12)}
.none-msg{padding:26px 16px 30px; text-align:center; color:var(--dim); font-size:14px; line-height:2; font-weight:500}
.wrow{display:grid; grid-template-columns:44px minmax(0,1fr) 36px; align-items:center; gap:10px; padding:8px 6px; border-radius:14px}
.wrow .who{min-width:0}
.wrow .who b{display:flex; align-items:center; gap:6px; font-size:15.5px; font-weight:700; min-width:0}
.wrow .who b span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; unicode-bidi:plaintext}
.wrow .who b .pb{width:17px; height:17px; flex:none}
.wrow .who small{display:block; color:var(--gold2); font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px}
.wrow .who small i{font-style:normal; color:var(--dim); font-weight:500}
.pb{border-radius:50%; display:inline-block; vertical-align:middle}

/* ───────── winner modal ───────── */
.modal{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:20px; background:rgba(5,6,9,.78);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); opacity:0; pointer-events:none; transition:opacity .28s}
.modal.open{opacity:1; pointer-events:auto}
.win-card{position:relative; width:min(430px, 100%); max-height:calc(100vh - 40px); overflow:auto; text-align:center; padding:30px 24px 22px; border-radius:30px;
  background:radial-gradient(130% 70% at 50% 0%, rgba(232,184,78,.2), transparent 62%), linear-gradient(180deg, #171B25, #0E1118);
  border:1px solid rgba(232,184,78,.42); box-shadow:0 40px 110px rgba(0,0,0,.75), 0 0 90px rgba(232,184,78,.14), inset 0 1px 0 rgba(255,255,255,.1);
  transform:translateY(22px) scale(.94); transition:transform .5s cubic-bezier(.2,1.25,.3,1)}
.modal.open .win-card{transform:none}
.win-kicker{display:inline-flex; align-items:center; gap:10px; color:var(--gold2); font-weight:700; font-size:14px}
.win-kicker::before,.win-kicker::after{content:""; width:28px; height:1px; background:rgba(232,184,78,.55)}
.win-avatar{position:relative; width:148px; height:148px; margin:20px auto 0; border-radius:50%; padding:5px;
  background:conic-gradient(from 200deg, #6E4A12, #F9E3A0 12%, #C08A2E 26%, #7A5417 40%, #F3D58A 54%, #B9822A 68%, #FBE7A8 88%, #6E4A12);
  box-shadow:0 16px 44px rgba(0,0,0,.55), 0 0 60px rgba(232,184,78,.3)}
.win-avatar .in{width:100%; height:100%; border-radius:50%; overflow:hidden; background:#0C0F15; display:grid; place-items:center; border:3px solid #0E1118}
.win-avatar img{width:100%; height:100%; object-fit:cover; display:block}
.win-avatar .ini{font-size:62px; font-weight:800; color:var(--gold1)}
.win-avatar .in > .pb{width:74%; height:74%}
.win-avatar .corner{position:absolute; left:2px; bottom:2px; width:44px; height:44px; border-radius:50%; box-shadow:0 0 0 4px #10141C, 0 4px 10px rgba(0,0,0,.5)}
.win-avatar .corner .pb{width:100%; height:100%; display:block}
.modal.open .win-avatar{animation:pop .7s cubic-bezier(.2,1.4,.3,1) .08s both}
@keyframes pop{from{transform:scale(.6); opacity:0} to{transform:none; opacity:1}}
.win-name{margin:18px 0 0; font-size:clamp(28px, 8vw, 40px); font-weight:800; line-height:1.4; overflow-wrap:anywhere; unicode-bidi:plaintext}
.win-plat{margin-top:2px; color:var(--muted); font-size:14.5px; font-weight:600; min-height:22px}
.win-prize{margin:18px 0 0; padding:14px 16px 15px; border-radius:20px; background:rgba(232,184,78,.09); border:1px solid rgba(232,184,78,.3)}
.win-prize small{display:block; color:var(--gold2); font-size:13px; font-weight:700}
.win-prize strong{display:block; margin-top:2px; font-size:clamp(21px, 6vw, 28px); font-weight:800; color:#FFF4D2; line-height:1.5; overflow-wrap:anywhere; unicode-bidi:plaintext}
.win-actions{display:grid; gap:9px; margin-top:20px}
.btn-main{height:54px; border-radius:16px; font-weight:800; font-size:17px; color:#2A1A00; background:linear-gradient(180deg, #FFF0BF, #F0C562 45%, #D49B36); box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 2px 0 #7A5417}
.btn-sec{height:48px; border-radius:16px; font-weight:700; font-size:15px; color:var(--text); background:rgba(255,255,255,.05); border:1px solid var(--line2)}
.btn-sec:hover{background:rgba(255,255,255,.09)}
#confetti{position:fixed; inset:0; width:100%; height:100%; z-index:50; pointer-events:none; display:none}
.toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); z-index:60; background:#1D2330; border:1px solid var(--line2);
  padding:11px 18px; border-radius:14px; font-size:14.5px; font-weight:600; box-shadow:0 16px 40px rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:88vw; text-align:center}
.toast.show{opacity:1; transform:translate(-50%, 0)}
.drop{position:fixed; inset:12px; z-index:70; border:2px dashed var(--gold2); border-radius:26px; background:rgba(9,11,16,.8); display:none; place-items:center; font-size:22px; font-weight:800; color:var(--gold1); pointer-events:none}
.dragging .drop{display:grid}

/* ───────── desktop ───────── */
@media (min-width:1000px){
  :root{--wheel:min(calc(100vw - 540px), calc((100vh - 272px) / 1.062), 820px)}
  html,body{overflow:hidden}
  .app{display:grid; grid-template-columns:minmax(0,1fr) 430px; height:100vh; padding-inline:12px}
  .stage{height:100vh; padding:14px 24px 16px; justify-content:flex-start; position:relative}
  .topbar{position:absolute; top:0; left:24px; right:24px; width:auto; padding:16px 4px 2px; pointer-events:none}
  .topbar > *{pointer-events:auto}
  .prize{width:min(calc(100% - 320px), 640px)}
  .brand{font-size:21px}
  #focusBtn{display:grid}
  .panel{margin:16px 4px 16px 12px; height:calc(100vh - 32px)}
  #prize{font-size:clamp(28px, 2.6vw, 42px)}
  .spin-btn{margin-top:20px}
  body.focus{--wheel:min(92vw, calc((100vh - 272px) / 1.062), 920px)}
  body.focus .app{grid-template-columns:1fr}
  body.focus .panel{display:none}
}
@media (prefers-reduced-motion:reduce){ .bulb{animation:none} .modal.open .win-avatar{animation:none} }
</style>

/* ───────── storage (IndexedDB, localStorage fallback) ───────── */
const Store = (() => {
  let dbp = null, dead = false;
  function open() {
    if (dead) return Promise.reject(new Error('no idb'));
    if (!dbp) dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('tiropshk', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      } catch (e) { rej(e); }
    }).catch(e => { dead = true; throw e; });
    return dbp;
  }
  function tx(mode, fn) {
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction('kv', mode); const q = fn(t.objectStore('kv'));
      t.oncomplete = () => res(q && q.result); t.onerror = t.onabort = () => rej(t.error);
    }));
  }
  const ls = {
    get(k) { try { const v = localStorage.getItem('tp:' + k); return v == null ? undefined : JSON.parse(v); } catch (e) { return undefined; } },
    set(k, v) { try { localStorage.setItem('tp:' + k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem('tp:' + k); } catch (e) {} }
  };
  return {
    get: k => tx('readonly', s => s.get(k)).catch(() => ls.get(k)),
    set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => ls.set(k, v)),
    del: k => tx('readwrite', s => s.delete(k)).catch(() => ls.del(k))
  };
})();

let uid = 0;
const newId = () => Date.now().toString(36) + (uid++).toString(36) + Math.floor(Math.random() * 1296).toString(36);
let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    Store.set('state', {
      v: 1, prize: state.prize, sound: state.sound, platform: state.platform, seed: state.seed,
      people: state.people.map(p => ({id: p.id, name: p.name, platform: p.platform, hasPhoto: !!p.photo})),
      winners: state.winners.map(w => ({id: w.id, name: w.name, platform: w.platform, prize: w.prize, t: w.t, hasPhoto: !!w.photo}))
    });
  }, 250);
}
const savePhoto = (id, data) => data ? Store.set('p:' + id, data) : Store.del('p:' + id);

async function load() {
  const s = await Store.get('state');
  if (!s || typeof s !== 'object') return;
  state.prize = typeof s.prize === 'string' ? s.prize : '';
  state.sound = s.sound !== false;
  state.seed = typeof s.seed === 'string' ? s.seed : '';
  state.platform = PLATS.includes(s.platform) ? s.platform : '';
  const fix = async (arr, extra) => {
    const out = [];
    for (const p of Array.isArray(arr) ? arr : []) {
      if (!p || !p.id) continue;
      const o = {id: String(p.id), name: String(p.name || ''), platform: PLATS.includes(p.platform) ? p.platform : '', photo: ''};
      if (p.hasPhoto) { const d = await Store.get('p:' + o.id); if (typeof d === 'string' && d.startsWith('data:image/')) o.photo = d; }
      if (extra) { o.prize = String(p.prize || ''); o.t = +p.t || Date.now(); }
      out.push(o);
    }
    return out;
  };
  state.people = await fix(s.people, false);
  state.winners = await fix(s.winners, true);
}

/* ───────── media cache: dataURL → blob URL + decoded image ───────── */
const media = new Map();
function dataToBlobURL(d) {
  try {
    const i = d.indexOf(','), mime = (d.slice(5, i).split(';')[0]) || 'image/jpeg', bin = atob(d.slice(i + 1));
    const u = new Uint8Array(bin.length);
    for (let j = 0; j < bin.length; j++) u[j] = bin.charCodeAt(j);
    return URL.createObjectURL(new Blob([u], {type: mime}));
  } catch (e) { return d; }
}
function mediaFor(p) {
  if (!p.photo) return null;
  let m = media.get(p.id);
  if (m && m.src === p.photo) return m;
  if (m && m.url.startsWith('blob:')) URL.revokeObjectURL(m.url);
  const url = dataToBlobURL(p.photo);
  m = {src: p.photo, url, img: null, ready: null};
  m.ready = new Promise(res => {
    const im = new Image();
    im.onload = () => { m.img = im; res(); };
    im.onerror = () => res();
    im.src = url;
  });
  media.set(p.id, m);
  return m;
}
function dropMedia(id) { const m = media.get(id); if (m) { if (m.url.startsWith('blob:')) URL.revokeObjectURL(m.url); media.delete(id); } }

function fileToAvatar(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type || 'image/')) return rej(new Error('type'));
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      try {

/* ───────── wheel drawing ───────── */
const canvas = $('#wheel'), wrap = $('#wheelWrap'), pointerEl = $('#pointer');
const SEG = [
  {c: '#D93A46', d: '#A4232F', l: '#EE5661', t: '#fff'},
  {c: '#2563EB', d: '#1947B4', l: '#4B82F5', t: '#fff'},
  {c: '#F0A52B', d: '#CC8315', l: '#FBC45A', t: '#2A1A00'},
  {c: '#12976B', d: '#0A6E4D', l: '#22B785', t: '#fff'},
  {c: '#7C4DDB', d: '#5A32AE', l: '#9A70EE', t: '#fff'},
  {c: '#0FA3B1', d: '#0A7884', l: '#2BC2D0', t: '#fff'}
];
function segColor(i, n) {
  if (n > 1 && i === n - 1 && i % SEG.length === 0) return SEG[2];
  return SEG[i % SEG.length];
}
let rot = 0, spinning = false, drawQueued = false;

function requestDraw() {
  if (drawQueued) return;
  drawQueued = true;
  const ps = state.people.map(p => { const m = mediaFor(p); return m ? m.ready : null; }).filter(Boolean);
  Promise.all(ps).then(() => requestAnimationFrame(() => { drawQueued = false; drawWheel(); }));
}

function drawWheel() {
  const css = canvas.clientWidth;
  if (!css) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const px = Math.max(64, Math.min(Math.round(css * dpr), 2400));
  if (canvas.width !== px) { canvas.width = px; canvas.height = px; }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, px, px);
  const u = px / 1000;
  ctx.setTransform(u, 0, 0, u, px / 2, px / 2);
  const R = 500, cssU = css / 1000;
  const people = state.people, n = people.length;
  $('#emptyMsg').hidden = n > 0;

  if (!n) {
    for (let i = 0; i < 8; i++) {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, i * TAU / 8, (i + 1) * TAU / 8); ctx.closePath();

        ctx.beginPath(); ctx.arc(0, 0, d / 2, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
        ctx.restore();
        ctx.save();

}
let nowIdx = -2, nowKey = '';

/* ───────── spin ───────── */
function rand() { const a = new Uint32Array(1); (window.crypto || window.msCrypto).getRandomValues(a); return a[0] / 4294967296; }

function spin() {

/* ───────── confetti ───────── */
let confRAF = 0;
function confetti() {

  c.width = W * dpr; c.height = H * dpr; c.style.display = 'block';

  const N = Math.min(230, 110 + Math.round(W / 6));
  const ps = [];
  for (let i = 0; i < N; i++) {
    const side = i % 2 ? 1 : -1, ang = (-Math.PI / 2) + side * (.25 + Math.random() * .75), sp = (H * .9 + W * .25) * (.55 + Math.random() * .65);
    ps.push({x: W / 2 - side * W * .46, y: H * .98, vx: Math.cos(ang) * sp * .62 * 1, vy: Math.sin(ang) * sp, w: 6 + Math.random() * 7, h: 9 + Math.random() * 9,

}

  $('#plats').innerHTML = PLATS.map(k => `<button type="button" class="plat-opt" role="radio" data-k="${k}" aria-checked="${state.platform === k}" title="${PLAT_NAME[k]}" aria-label="${PLAT_NAME[k]}">${badgeSVG(k)}</button>`).join('');
}
$('#plats').addEventListener('click', e => {
  const b = e.target.closest('.plat-opt'); if (!b) return;
  state.platform = state.platform === b.dataset.k ? '' : b.dataset.k;
  renderPlats(); save();
});
pick.addEventListener('click', () => { photoTarget = null; fileOne.value = ''; fileOne.click(); });
fileOne.addEventListener('change', async () => {
  const f = fileOne.files && fileOne.files[0]; if (!f) return;
  try {
    const d = await fileToAvatar(f);
    if (photoTarget) {
      const p = state.people.find(x => x.id === photoTarget);
      if (p) { p.photo = d; savePhoto(p.id, d); refresh(); }
    } else { setFormPhoto(d); nameIn.focus(); }
  } catch (e) { toast('وێنەکە نەخوێندرایەوە'); }
});
$('#multiPhoto').addEventListener('click', () => { fileMany.value = ''; fileMany.click(); });
fileMany.addEventListener('change', () => addFiles(fileMany.files));
$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = nameIn.value.trim();
  if (!name && !formPhoto) { toast('ناوێک بنووسە یان وێنەیەک هەڵبژێرە'); nameIn.focus(); return; }
  addPerson(name, formPhoto, state.platform);
  nameIn.value = ''; setFormPhoto('');
  refresh();
  listEl.scrollTop = listEl.scrollHeight;
  nameIn.focus();
});
$('#bulkToggle').addEventListener('click', () => { const b = $('#bulkBox'); b.hidden = !b.hidden; if (!b.hidden) $('#bulkText').focus(); });
$('#bulkAdd').addEventListener('click', () => {
  if (!parseNames($('#bulkText').value).length) { toast('لە هەر دێڕێکدا ناوێک بنووسە'); return; }
  addNames($('#bulkText').value);
  $('#bulkText').value = ''; $('#bulkBox').hidden = true;
});
/* pasted text → one clean name per entry */
function parseNames(text) {
  let parts = String(text || '').replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g, '').split(/[\r\n\t]+|\s*[،,;؛|]\s*/);
  const out = [];
  for (let s of parts) {
    s = s.replace(/^\s*(?:[-–—•*·▪●]+|\(?[0-9٠-٩۰-۹]{1,4}[.)\-:]\)?)\s+/, '').replace(/\s+/g, ' ').trim();
    if (!s) continue;
    const toks = s.split(' ');
    if (toks.length > 1 && toks.every(t => t.charAt(0) === '@' && t.length > 1)) out.push(...toks); else out.push(s);
  }
  return out.map(s => s.slice(0, 60));
}
const nameKey = s => String(s || '').trim().replace(/^@+/, '').toLowerCase();
function addNames(text) {
  const have = new Set(state.people.map(p => nameKey(p.name)).filter(Boolean));
  let added = 0, dup = 0;
  for (const nm of parseNames(text)) {
    const k = nameKey(nm);
    if (!k) continue;
    if (have.has(k)) { dup++; continue; }
    have.add(k); addPerson(nm, '', state.platform); added++;
  }
  if (added) { refresh(); listEl.scrollTop = listEl.scrollHeight; }
  toast(added + ' کەس زیادکرا' + (dup ? ' · ' + dup + ' دووبارە لابرا' : ''));
  return added;
}
nameIn.addEventListener('paste', e => {
  const t = e.clipboardData ? e.clipboardData.getData('text') : '';
  if (!t || parseNames(t).length < 2) return;
  e.preventDefault(); e.stopPropagation();
  addNames(t); nameIn.value = '';
});

/* import / export of the list (move it between devices) */
$('#exportBtn').addEventListener('click', () => {
  if (!state.people.length) { toast('لیست بەتاڵە'); return; }
  const data = JSON.stringify({app: 'tiropshk', v: 1, people: state.people.map(p => ({name: p.name, platform: p.platform, photo: p.photo}))});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'})); a.download = 'tiropshk-list.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});
$('#importBtn').addEventListener('click', () => { $('#fileJson').value = ''; $('#fileJson').click(); });
$('#fileJson').addEventListener('change', async () => {
  const f = $('#fileJson').files && $('#fileJson').files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); let n = 0;
    const have = new Set(state.people.map(p => (p.name || '').toLowerCase() + '|' + p.platform));
    for (const x of Array.isArray(j.people) ? j.people : []) {
      const name = String((x && x.name) || '').trim(), plat = PLATS.includes(x && x.platform) ? x.platform : '';
      const photo = x && typeof x.photo === 'string' && x.photo.startsWith('data:image/') ? x.photo : '';
      if (!name && !photo) continue;
      if (name && have.has(name.toLowerCase() + '|' + plat)) continue;
      addPerson(name, photo, plat); have.add(name.toLowerCase() + '|' + plat); n++;
    }
    refresh(); toast(n ? n + ' کەس هاوردەکرا' : 'هیچ کەسێکی نوێ نەبوو');
  } catch (e) { toast('فایلەکە دروست نییە'); }
});

/* list interactions */
listEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('.row').dataset.id, p = state.people.find(x => x.id === id); if (!p) return;
  if (b.dataset.act === 'del') removePerson(id);
  else if (b.dataset.act === 'plat') {
    const order = [''].concat(PLATS);
    p.platform = order[(order.indexOf(p.platform) + 1) % order.length];
    b.className = 'rb ' + (p.platform ? '' : 'none');
    b.innerHTML = p.platform ? badgeSVG(p.platform) : IC_PLUS;
    refresh(false);
  } else if (b.dataset.act === 'photo') { photoTarget = id; fileOne.value = ''; fileOne.click(); }
});
listEl.addEventListener('input', e => {
  if (!e.target.classList.contains('nm')) return;
  const p = state.people.find(x => x.id === e.target.closest('.row').dataset.id);
  if (p) { p.name = e.target.value.slice(0, 60); refresh(false); }
});
listEl.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('nm')) e.target.blur(); });
wlistEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act="wdel"]'); if (!b) return;
  const id = b.closest('.wrow').dataset.id, i = state.winners.findIndex(w => w.id === id);
  if (i >= 0) { state.winners.splice(i, 1); savePhoto(id, ''); dropMedia(id); renderWinners(); counts(); save(); }
});

/* two-step destructive buttons */
function confirmBtn(btn, label, fn) {
  let t = 0;
  btn.addEventListener('click', () => {
    if (btn.classList.contains('sure')) { clearTimeout(t); btn.classList.remove('sure'); btn.textContent = label; fn(); return; }
    btn.classList.add('sure'); btn.textContent = 'دڵنیایت؟ دووبارە کرتە بکە';
    t = setTimeout(() => { btn.classList.remove('sure'); btn.textContent = label; }, 3200);
  });
}
confirmBtn($('#clearBtn'), 'سڕینەوەی هەمووی', () => {
  state.people.forEach(p => { savePhoto(p.id, ''); dropMedia(p.id); });
  state.people = []; refresh();
});
confirmBtn($('#clearWinners'), 'پاککردنەوە', () => {
  state.winners.forEach(w => { savePhoto(w.id, ''); dropMedia(w.id); });
  state.winners = []; renderWinners(); counts(); save();
});
$('#shuffleBtn').addEventListener('click', () => {
  const a = state.people;
  for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  refresh();
});

/* tabs */
function showTab(w) {
  $('#tabPeople').setAttribute('aria-selected', String(!w)); $('#tabWinners').setAttribute('aria-selected', String(!!w));
  $('#panePeople').hidden = !!w; $('#paneWinners').hidden = !w;
}
$('#tabPeople').addEventListener('click', () => showTab(false));
$('#tabWinners').addEventListener('click', () => showTab(true));

/* prize */
const prizeEl = $('#prize');
function sizePrize() { prizeEl.style.height = 'auto'; prizeEl.style.height = Math.min(prizeEl.scrollHeight, parseFloat(getComputedStyle(prizeEl).fontSize) * 2.95) + 'px'; }
prizeEl.addEventListener('input', () => { prizeEl.value = prizeEl.value.replace(/\n/g, ' '); state.prize = prizeEl.value; sizePrize(); save(); });
prizeEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); prizeEl.blur(); } });

/* tools */
const soundBtn = $('#soundBtn'), focusBtn = $('#focusBtn');
soundBtn.addEventListener('click', () => { state.sound = !state.sound; soundBtn.setAttribute('aria-pressed', String(state.sound)); if (state.sound) { Sound.init(); Sound.tick(1); } save(); });
focusBtn.addEventListener('click', () => { const f = document.body.classList.toggle('focus'); focusBtn.setAttribute('aria-pressed', String(!f)); });

/* full screen (for screen recording) */
const fsBtn = $('#fsBtn'), rootEl = document.documentElement;
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function setFs(on) {
  document.body.classList.toggle('fs', on); document.body.classList.toggle('focus', on);
  fsBtn.setAttribute('aria-pressed', String(on)); focusBtn.setAttribute('aria-pressed', String(!on));
  requestDraw();
}
function toggleFs() {
  if (fsOn()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  const req = rootEl.requestFullscreen || rootEl.webkitRequestFullscreen;
  if (req) { try { const r = req.call(rootEl); if (r && r.catch) r.catch(() => setFs(true)); } catch (e) { setFs(true); } }
  else setFs(!document.body.classList.contains('fs')); // iPhone Safari: no real fullscreen, just hide the panel
}
fsBtn.addEventListener('click', toggleFs);
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => setFs(fsOn())));

/* spin triggers */
$('#spinBtn').addEventListener('click', spin);
wrap.addEventListener('click', spin);
wrap.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spin(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalOpen) { closeModal(false); return; }
  if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && !(e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) { toggleFs(); return; }
  const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
  if (e.code === 'Space' && !typing && !modalOpen && t !== wrap && t.tagName !== 'BUTTON') { e.preventDefault(); spin(); }
});
$('#winOk').addEventListener('click', () => closeModal(false));
$('#winRemove').addEventListener('click', () => closeModal(true));
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(false); });
document.addEventListener('pointerdown', () => Sound.init(), {once: true, passive: true});

/* paste + drag and drop of photos */
document.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.files ? Array.from(e.clipboardData.files).filter(f => /^image\//.test(f.type)) : [];
  if (!items.length || spinning) return;
  e.preventDefault();
  if (items.length === 1) fileToAvatar(items[0]).then(d => { setFormPhoto(d); showTab(false); nameIn.focus(); }).catch(() => toast('وێنەکە نەخوێندرایەوە'));
  else addFiles(items);
});
let dragN = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
document.addEventListener('dragenter', e => { if (hasFiles(e)) { dragN++; document.body.classList.add('dragging'); } });
document.addEventListener('dragleave', e => { if (hasFiles(e) && --dragN <= 0) { dragN = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragN = 0; document.body.classList.remove('dragging');
  if (!spinning) { showTab(false); addFiles(e.dataTransfer.files); }
});

/* toast */
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

/* ───────── boot ───────── */
const rim = $('#rim');
for (let i = 0; i < 24; i++) { const b = document.createElement('i'); b.className = 'bulb'; b.style.setProperty('--i', i); rim.appendChild(b); }
if (window.ResizeObserver) new ResizeObserver(() => requestDraw()).observe(wrap); else addEventListener('resize', requestDraw);
addEventListener('resize', sizePrize);

(async () => {
  try { await load(); } catch (e) {}
  if (SEED && SEED.id && state.seed !== SEED.id) { // built-in list: added once per device, never re-added after a winner is removed
    const have = new Set(state.people.map(p => (p.name || '').trim().replace(/^@+/, '').toLowerCase()));
    for (const x of SEED.people || []) {
      const k = String(x.name || '').trim().replace(/^@+/, '').toLowerCase();
      if (k && have.has(k)) continue;
      have.add(k); addPerson(x.name, x.photo || '', PLATS.includes(x.platform) ? x.platform : '');
    }
    if (!state.prize && SEED.prize) state.prize = SEED.prize;
    state.seed = SEED.id; save();
  }
  prizeEl.value = state.prize; sizePrize();
  soundBtn.setAttribute('aria-pressed', String(state.sound));
  renderPlats(); renderList(); renderWinners(); counts();
  setRot(-Math.PI / 2 - (state.people.length ? Math.PI / state.people.length : 0));
  setNow(indexAtPointer());
  try { if (document.fonts && document.fonts.load) await Promise.race([document.fonts.load('700 20px Vazirmatn', 'ناو Aa'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  requestDraw();
  setTimeout(() => document.body.classList.add('ready'), 400);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { sizePrize(); requestDraw(); });
})();

})();
</script>
</body>
</html>
